name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory deploy/ResourceMonitor | Out-Null
          Copy-Item build/resource-monitor.exe deploy/ResourceMonitor/
          windeployqt --release --no-compiler-runtime --no-opengl-sw --no-system-d3d-compiler `
            deploy/ResourceMonitor/resource-monitor.exe
          Copy-Item LICENSE deploy/ResourceMonitor/
          # MSVC runtime, so the app runs on a clean Windows without extra installers.
          Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT\*.dll" |
            Copy-Item -Destination deploy/ResourceMonitor/
          Compress-Archive deploy/ResourceMonitor ResourceMonitor-windows-x64.zip

      - name: Smoke test (text report)
        shell: pwsh
        run: |
          $p = Start-Process deploy/ResourceMonitor/resource-monitor.exe -ArgumentList "--report" `
               -RedirectStandardOutput report.txt -Wait -PassThru -NoNewWindow
          Get-Content report.txt
          if ($p.ExitCode -ne 0) { throw "resource-monitor --report failed: $($p.ExitCode)" }

      - name: Smoke test (window stays open)
        shell: pwsh
        run: |
          $p = Start-Process deploy/ResourceMonitor/resource-monitor.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "resource-monitor.exe exited early: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ResourceMonitor-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libfuse2 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          DESTDIR=AppDir cmake --install build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH"
          export OUTPUT=ResourceMonitor-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          ls -l ResourceMonitor-x86_64.AppImage

      - name: Smoke test (text report)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./ResourceMonitor-x86_64.AppImage --report

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ResourceMonitor-x86_64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ResourceMonitor-windows-x64.zip
            ResourceMonitor-x86_64.AppImage
          generate_release_notes: true
